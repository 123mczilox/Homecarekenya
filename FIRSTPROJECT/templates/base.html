{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f8f6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="{% static 'css/homecare.css' %}">
    <title>{% block title %}HomeCare Kenya | Every Need Seen{% endblock %}</title>
    {{ HOMECARE_API_BASE_URL|json_script:"homecare-api-config" }}
</head>

<body>
    {% include 'navbar.html' %}
    <main>{% block content %}{% endblock %}</main>
    <script defer src="{% static 'js/homecare-api.js' %}"></script>
</body>

</html>
